# Sonatype Guide — Agentic Patches (AGP) Workflow
# Learn more: https://guide.sonatype.com
# File: .github/workflows/agp_workflow.yml
#
# AGP scans your Maven dependencies, recommends upgrades,
# and opens pull requests with the changes automatically.

name: "Sonatype Guide - Agentic Patches"

on:
  # Run every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual runs with optional overrides
  workflow_dispatch:
    inputs:
      mode:
        description: "AGP run mode (full | security | outdated)"
        type: string
        default: 'full'
      vulnerabilities:
        description: "Comma-separated CVE IDs to target (optional)"
        type: string
        required: false
      verbose:
        description: "Enable verbose AGP output"
        type: boolean
        default: false

# Required for AGP to create branches and open pull requests,
# and for OIDC-based authentication with Sonatype Guide.
permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for Sonatype Guide OIDC

# Prevent overlapping AGP runs for the same repo.
concurrency:
  group: agp-workflow
  cancel-in-progress: false

jobs:
  agp:
    name: "Agentic Patches"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Private registry authentication ────────────────────────────────
      # This project uses public Maven Central — no private registry auth needed.
      # If you later add a private Nexus/Artifactory registry, uncomment the
      # step below and set MAVEN_REGISTRY_URL / MAVEN_REGISTRY_TOKEN in your
      # repository secrets.
      #
      # - name: Configure Maven settings for private registry
      #   run: |
      #     mkdir -p ~/.m2
      #     cat > ~/.m2/settings.xml <<'EOF'
      #     <settings>
      #       <servers>
      #         <server>
      #           <id>private-registry</id>
      #           <username>${{ secrets.MAVEN_REGISTRY_USERNAME }}</username>
      #           <password>${{ secrets.MAVEN_REGISTRY_TOKEN }}</password>
      #         </server>
      #       </servers>
      #       <mirrors>
      #         <mirror>
      #           <id>private-registry</id>
      #           <url>https://your-registry.example.com/repository/maven-public/</url>
      #           <mirrorOf>central</mirrorOf>
      #         </mirror>
      #       </mirrors>
      #     </settings>
      #     EOF

      # ── 3. AGP Action ──────────────────────────────────────────────────────
      - name: Run Sonatype Agentic Patches
        uses: sonatype/agp-action@v1
        with:
          # Run mode: full | security | outdated
          mode: ${{ inputs.mode || 'full' }}

          # Specific CVEs to remediate (leave empty for all)
          vulnerabilities: ${{ inputs.vulnerabilities }}

          # Open a pull request for each patch set
          create-pr: 'true'

          # Set to 'true' to preview changes without opening PRs
          dry-run: 'false'

          # Verbose logging for debugging
          verbose: ${{ inputs.verbose || 'false' }}

          # Docker registry AGP uses to pull its analysis images (always required)
          docker-registry: sonatype.repo.sonatype.app/docker-all

          # ── Docker credentials ──────────────────────────────────────────
          # Uncomment if your environment requires authenticated Docker pulls
          # from the registry above.
          # docker-username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          # docker-password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

          # ── npm / yarn / pnpm ───────────────────────────────────────────
          # Not applicable — this project has no Node.js components.
          # Uncomment and populate if npm is added later.
          # npmrc-content: |
          #   registry=https://your-registry.example.com/repository/npm-proxy/
          #   //your-registry.example.com/repository/npm-proxy/:_authToken=${{ secrets.NPM_TOKEN }}

          # ── Maven settings.xml ──────────────────────────────────────────
          # Not required for public Maven Central. Uncomment and fill in if
          # you add a private Nexus/Artifactory registry.
          # maven-settings-xml: |
          #   <settings>
          #     <servers>
          #       <server>
          #         <id>private-registry</id>
          #         <username>${{ secrets.MAVEN_REGISTRY_USERNAME }}</username>
          #         <password>${{ secrets.MAVEN_REGISTRY_TOKEN }}</password>
          #       </server>
          #     </servers>
          #     <mirrors>
          #       <mirror>
          #         <id>private-registry</id>
          #         <url>https://your-registry.example.com/repository/maven-public/</url>
          #         <mirrorOf>central</mirrorOf>
          #       </mirror>
          #     </mirrors>
          #   </settings>

          # ── Python / pip ────────────────────────────────────────────────
          # Not applicable — this project has no Python components.
          # pip-index-url: https://your-registry.example.com/repository/pypi-proxy/simple/
          # pip-extra-index-url: https://pypi.org/simple/

        env:
          # GitHub token — used by AGP to create branches and PRs
          GITHUB_TOKEN: ${{ github.token }}

          # ── AGP API token (optional) ────────────────────────────────────
          # Only needed if OIDC is not available in your environment.
          # AGP_API_TOKEN: ${{ secrets.AGP_API_TOKEN }}

          # ── AGP API URL (optional) ──────────────────────────────────────
          # Auto-discovered via OIDC. Override only if using a self-hosted
          # Sonatype Guide instance.
          # AGP_API_URL: ${{ vars.AGP_API_URL }}
